<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip editor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141518;--pn:#1e2025;--ln:#33363e;--tx:#e8e9eb;--mu:#8d919b;--ac:#3b9eff;--c1:#ff3fa4;--c2:#25d0e8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 'IBM Plex Sans',system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:14px;display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu)}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px}
button,select,input{font:inherit;color:inherit}
.btn,button{background:#2a2d34;border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover,button:hover{background:#343841}
button.on{background:#e8e9eb;color:#141518;border-color:#e8e9eb}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number]{background:#141518;border:1px solid var(--ln);border-radius:6px;padding:5px 8px}
input[type=number]{width:64px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#top{display:grid;grid-template-columns:1fr 340px;gap:0}
@media(max-width:820px){#top{grid-template-columns:1fr}}
#sw{display:flex;justify-content:center;padding:14px}
#stage{position:relative;background:#000;touch-action:none;user-select:none}
#vid{position:absolute;pointer-events:none}
#dim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crop{position:absolute;border:2px solid var(--k);cursor:move}
.h{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;border:2px solid var(--k)}
#out{display:flex;flex-direction:column}
#fbox{position:relative;flex:1;min-height:200px;margin:8px 0}
#F{position:absolute;left:8px;top:8px;background:#000;outline:1px solid var(--ln)}
#F.full,#F.pip{left:50%;top:50%;transform:translate(-50%,-50%)}
#ctl{margin-top:auto;padding-top:8px}
.ic{width:1.25em;height:1.25em;fill:currentColor;flex:none;vertical-align:-.25em}
button,.btn{display:inline-flex;align-items:center;gap:6px}

#F canvas{position:absolute;display:block}
#c1,#c2{box-shadow:inset 0 0 0 2px var(--k)}
.full #c1{box-shadow:none}
#split{position:absolute;background:#fff;z-index:2}
#split::before{content:"";position:absolute;inset:-9px}
#split::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:14px;margin:-7px 0 0 -17px;background:#fff;border-radius:7px}
#split.hz{left:0;right:0;height:2px;margin-top:-1px;cursor:ns-resize}
#split.vt{top:0;bottom:0;width:2px;margin-left:-1px;cursor:ew-resize}
#rz{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;background:#fff;border-radius:50%;cursor:nwse-resize;z-index:3}
#trk{position:relative;height:64px;margin:12px 20px 10px;touch-action:none;cursor:pointer;border-radius:6px;background-color:#111215;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 10px)}
#wf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

#sel{position:absolute;top:0;bottom:0;box-sizing:border-box;background:rgba(59,158,255,.16);border:3px solid var(--ac);border-left:0;border-right:0;pointer-events:none}
.hd{position:absolute;top:-3px;bottom:-3px;width:14px;background:var(--ac);cursor:ew-resize;z-index:2}
#hs{margin-left:-14px;border-radius:6px 0 0 6px}
#he{border-radius:0 6px 6px 0}
.hd::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:18px;margin:-9px 0 0 -2px;background:radial-gradient(circle,rgba(255,255,255,.9) 1.1px,transparent 1.5px) 0 0/4px 6px}
#ph{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;z-index:3}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
progress{width:100%;height:8px}
video.res{max-width:100%;max-height:300px;border-radius:6px;background:#000}
#empty{text-align:center;padding:60px 12px}
.tip{position:relative;font-style:normal;color:var(--mu);cursor:help}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:0;top:1.6em;z-index:9;width:250px;padding:8px 10px;background:#000;border:1px solid var(--ln);border-radius:6px;color:var(--tx);white-space:pre-line;font-size:12px;line-height:1.4}
a.btn{color:var(--tx);text-decoration:none;display:inline-block}
.g input,.g select{width:100%}
.g input[type=number]{width:100%}
summary{cursor:pointer}
.dz{position:relative}
.dz::after{content:"";position:absolute;inset:5px;border:2px dotted var(--mu);border-radius:6px;opacity:0;transition:opacity .15s,inset .15s;pointer-events:none}
.dz:hover::after{opacity:.4;inset:9px}
body.dragging .dz::after{opacity:.6;inset:9px}
.dz.over::after{opacity:1;inset:13px;border-color:var(--ac)}
#pz{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;background:#fff;border:2px solid var(--c1);border-radius:50%;cursor:nwse-resize;z-index:3}
.pip #c2{cursor:move}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}
#cmd{resize:vertical;width:100%;height:150px;margin-top:4px;background:#0d0e10;color:#cfd3da;border:1px solid var(--ln);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
#trk.zm{outline:1px dashed var(--ac);outline-offset:6px;border-radius:4px}
#trk.zm::after{content:"zoomed";position:absolute;right:0;top:-18px;font-size:11px;color:var(--ac)}
#app{padding:0}
.sec{border-top:1px solid var(--ln);padding:12px 14px}
#out{padding:12px;border-left:1px solid var(--ln)}
#empty{cursor:pointer}
@media(max-width:820px){#out{border-left:0;border-top:1px solid var(--ln)}}
#tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px}
.tbl{display:flex;gap:8px;justify-self:start}
.tbc{display:flex;align-items:center;gap:10px}
.times{display:inline-flex;align-items:center;gap:4px}
.tbr{display:flex;align-items:center;gap:8px;justify-self:end}
button.ib{position:relative;padding:6px 9px}
button.ib .ic{width:1.35em;height:1.35em}
.ib:hover::after,.ib:focus-visible::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:9;padding:4px 8px;background:#000;border:1px solid var(--ln);border-radius:6px;color:var(--tx);font-size:12px;white-space:nowrap;pointer-events:none}
@media(max-width:760px){#tb{grid-template-columns:1fr;justify-items:center}.tbl,.tbr{justify-self:center}}
#loupe{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border:3px solid #fff;border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.65);pointer-events:none;z-index:5000;image-rendering:pixelated;background:#000}
</style>
</head>
<body>

51a8,8,0,0,0,9,.56,8.29,8.29,0,0,0,3.91-7.18V32.25A8.27,8.27,0,0,0,157.12,25.85Z"/></symbol><symbol id="ph-speaker-high-fill" viewBox="0 0 256 256"><path d="M160,32.25V223.69a8.29,8.29,0,0,1-3.91,7.18,8,8,0,0,1-9-.56l-65.57-51A4,4,0,0,1,80,176.16V79.84a4,4,0,0,1,1.55-3.15l65.57-51a8,8,0,0,1,10,.16A8.27,8.27,0,0,1,160,32.25ZM60,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H60a4,4,0,0,0,4-4V84A4,4,0,0,0,60,80Zm126.77,20.84a8,8,0,0,0-.72,11.3,24,24,0,0,1,0,31.72,8,8,0,1,0,12,10.58,40,40,0,0,0,0-52.88A8,8,0,0,0,186.74,100.84Zm40.89-26.17a8,8,0,1,0-11.92,10.66,64,64,0,0,1,0,85.34,8,8,0,1,0,11.92,10.66,80,80,0,0,0,0-106.66Z"/></symbol><symbol id="ph-play-fill" viewBox="0 0 256 256"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></symbol><symbol id="ph-pause-fill" viewBox="0 0 256 256"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/></symbol><symbol id="ph-film-reel" viewBox="0 0 256 256"><path d="M232,216H183.36A103.95,103.95,0,1,0,128,232H232a8,8,0,0,0,0-16ZM40,128a88,88,0,1,1,88,88A88.1,88.1,0,0,1,40,128Zm88-24a24,24,0,1,0-24-24A24,24,0,0,0,128,104Zm0-32a8,8,0,1,1-8,8A8,8,0,0,1,128,72Zm24,104a24,24,0,1,0-24,24A24,24,0,0,0,152,176Zm-32,0a8,8,0,1,1,8,8A8,8,0,0,1,120,176Zm56-24a24,24,0,1,0-24-24A24,24,0,0,0,176,152Zm0-32a8,8,0,1,1-8,8A8,8,0,0,1,176,120ZM80,104a24,24,0,1,0,24,24A24,24,0,0,0,80,104Zm0,32a8,8,0,1,1,8-8A8,8,0,0,1,80,136Z"/></symbol><symbol id="ph-download" viewBox="0 0 256 256"><path d="M240,136v64a16,16,0,0,1-16,16H32a16,16,0,0,1-16-16V136a16,16,0,0,1,16-16H72a8,8,0,0,1,0,16H32v64H224V136H184a8,8,0,0,1,0-16h40A16,16,0,0,1,240,136Zm-117.66-2.34a8,8,0,0,0,11.32,0l48-48a8,8,0,0,0-11.32-11.32L136,108.69V24a8,8,0,0,0-16,0v84.69L85.66,74.34A8,8,0,0,0,74.34,85.66ZM200,168a12,12,0,1,0-12,12A12,12,0,0,0,200,168Z"/></symbol><symbol id="ph-copy" viewBox="0 0 256 256"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></symbol></svg>
<main>
<header class="row">
  <b style="font-size:16px">Clip editor</b>
  <label class="btn">Open video<input id="file" type="file" accept="video/*" hidden></label>
  <span id="fname" class="mu"></span>
  <span id="eng" class="mu" style="margin-left:auto">WebCodecs via Mediabunny · ffmpeg.wasm loads on demand</span>
</header>
<div id="empty" class="pn mu dz" tabindex="0" role="button" aria-label="Choose a video file"><svg class="ic" style="width:34px;height:34px;display:block;margin:0 auto 8px"><use href="#ph-upload"/></svg>Drop a video anywhere, or click here to choose a file.</div>

<div id="app" class="pn" hidden>
  <div id="top">
    <div id="sw" class="dz">
      <div id="stage">
        <video id="vid" playsinline></video>
        <svg id="dim" preserveAspectRatio="none"><defs><mask id="mk"><rect id="mr" fill="#fff"/><g id="holes" fill="#000"></g></mask></defs><rect id="dr" mask="url(#mk)" fill="rgba(0,0,0,.35)"/></svg>
        <div id="crops"></div><canvas id="loupe" hidden></canvas>
      </div>
    </div>
    <div id="out">
      <div class="row"><b>Output</b><span id="info" class="mu" style="margin-left:auto"></span></div>
      <div id="fbox"><div id="F"><canvas id="c1"></canvas><canvas id="c2"></canvas><div id="split"></div><i id="rz" title="Drag to change aspect ratio"></i><i id="pz" title="Resize overlay" hidden></i></div></div>
      <div id="ctl" class="row">
        <span class="mu" id="rlab">Ratio</span>
        <select id="ratio"></select>
        <span id="cust" class="row" style="gap:4px" hidden><input id="ra" type="number" min="0.01" step="0.01" value="9"><span>:</span><input id="rb" type="number" min="0.01" step="0.01" value="16"></span>
      </div>
    </div>
  </div>

  <div class="sec">
    <div id="tb">
      <span class="tbl"><button id="mu" class="ib" data-tip="Sound on" aria-label="Sound on"><svg class="ic"><use href="#ph-speaker-high-fill"/></svg></button><button id="rot" class="ib" data-tip="Rotate" aria-label="Rotate"><svg class="ic"><use href="#ph-arrows-clockwise"/></svg></button></span>
      <span class="tbc"><button id="pl" style="min-width:92px;justify-content:center"><svg class="ic"><use href="#ph-play-fill"/></svg> Play</button><span class="times"><input id="ts" type="text" size="7" aria-label="Start"><span class="mu">to</span><input id="te" type="text" size="7" aria-label="End"></span></span>
      <span class="tbr"><span class="row"><span class="mu">Crop</span><span class="seg"><button id="mFull"><svg class="ic"><use href="#ph-rectangle"/></svg> Full</button><button id="mStack"><svg class="ic"><use href="#ph-square-split-vertical"/></svg> Stacked</button><button id="mPip"><svg class="ic"><use href="#ph-picture-in-picture"/></svg> PiP</button></span></span></span>
    </div>
    <div id="trk"><canvas id="wf"></canvas><div id="sel"></div><div id="ph"></div><div class="hd" id="hs"></div><div class="hd" id="he"></div></div>
  </div>
  <div class="sec">
    <div class="row" style="gap:16px;align-items:flex-end">
      <label style="flex:1;min-width:220px">Quality <b id="qv">100%</b><input id="q" type="range" min="0" max="100" value="100" style="width:100%"></label>
      <label>Video codec <i class="tip" tabindex="0" data-tip="H.264: plays everywhere, fast to encode.&#10;H.265: ~35% smaller, poor browser support.&#10;VP9: efficient WebM, slow to encode.&#10;VP8: older WebM, weak compression.&#10;AV1: best compression, very slow to encode.&#10;Audio: AAC for H.264/H.265, Opus for VP8/VP9/AV1. VP8/VP9 use WebM, others MP4. At 100% quality, matching the source codec (with default audio/bitrate/fps settings) enables smart cut.">ⓘ</i><br><select id="codec"></select></label>
      <span class="row"><button id="go" class="pri"><svg class="ic"><use href="#ph-film-reel"/></svg> Export</button><button id="cancel" hidden>Cancel</button></span>
    </div>
    <div id="est" style="margin-top:8px"></div><div id="sinfo" class="mu"></div><div id="hwn" class="mu"></div>
    <details style="margin-top:10px"><summary>Advanced</summary>
     <div class="g" style="margin-top:10px">
      <label>Encoder speed <i class="tip" tabindex="0" data-tip="Slower settings compress better at the same quality but take much longer in wasm.">ⓘ</i><br><select id="preset"><option value="0">Fastest</option><option value="1" selected>Fast</option><option value="2">Balanced</option></select></label>
      <label>Video bitrate (kb/s) <i class="tip" tabindex="0" data-tip="Overrides the bitrate derived from the quality slider. Ignored if CRF is set.">ⓘ</i><br><input id="vb" type="number" min="50" placeholder="auto"></label>
      <label>CRF <i class="tip" tabindex="0" data-tip="Constant-quality mode, replaces the bitrate target. Lower = better and larger. Typical: 18-28 for H.264/H.265, 25-38 for VP9/AV1. File size becomes unpredictable.">ⓘ</i><br><input id="crf" type="number" min="0" max="63" placeholder="off"></label>
      <label>Audio <i class="tip" tabindex="0" data-tip="Auto: copy above 85% quality, otherwise copy only if the source bitrate is already low enough, else re-encode. Copy falls back to re-encode if the codec doesn't fit the container.">ⓘ</i><br><select id="am"><option value="auto">Auto</option><option value="copy">Copy</option><option value="enc">Re-encode</option></select></label>
      <label>Audio bitrate (kb/s) <i class="tip" tabindex="0" data-tip="Used when audio is re-encoded. Auto: 64-128 kb/s by quality (x0.75 for Opus).">ⓘ</i><br><input id="ab" type="number" min="16" placeholder="auto"></label>
      <label>Max side <i class="tip" tabindex="0" data-tip="Source: output never exceeds the source frame (long side up to the source long side, short side up to the source short side), so cropping or stacking won't upscale past the source.&#10;No limit: keep crop resolution as is.&#10;Others: cap the longest side.">ⓘ</i><br><select id="maxs"><option value="src" selected>Source</option><option value="0">No limit</option><option value="1920">1920 px</option><option value="1280">1280 px</option><option value="960">960 px</option><option value="640">640 px</option></select></label>
      <label>Frame rate <i class="tip" tabindex="0" data-tip="Drops frames to reduce size. Only lowers the rate, never raises it. Disables smart cut.">ⓘ</i><br><select id="fps"><option value="0">Source</option><option>60</option><option>50</option><option>30</option><option>25</option><option>24</option><option>15</option><option>12</option><option>10</option></select></label>
      <label>Encoder <i class="tip" tabindex="0" data-tip="Auto: hardware-accelerated WebCodecs (via Mediabunny) when the browser can encode the chosen codec, otherwise ffmpeg.wasm.&#10;Hardware: WebCodecs only.&#10;Software: ffmpeg.wasm (slower; always used for smart cut and CRF).">ⓘ</i><br><select id="encsel"><option value="auto">Auto</option><option value="hw">Hardware (WebCodecs)</option><option value="sw">Software (ffmpeg.wasm)</option></select></label>
     </div>
